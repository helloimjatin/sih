<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
    <!-- TopAppBar (Suppressed per logic: linear transactional flow) -->
    <!-- Main Content Canvas -->
    <main
        class="flex-grow flex flex-col items-center justify-center px-container-margin py-unit-6 w-full max-w-4xl mx-auto">
        <!-- Progress Indicator -->
        <div class="w-full mb-unit-6 max-w-2xl">
            <div
                class="flex justify-between items-center mb-unit-2 font-label-sm text-label-sm text-on-surface-variant">
                <span>Step 2 of 5</span>
                <span>Chief Complaint</span>
            </div>
            <div
                class="w-full bg-surface-container h-4 rounded-full overflow-hidden shadow-[inset_4px_4px_8px_#dbd9d9,inset_-4px_-4px_8px_#ffffff]">
                <div
                    class="bg-gradient-to-r from-primary to-surface-tint h-full w-2/5 rounded-full shadow-[2px_2px_4px_rgba(0,0,0,0.1)]">
                </div>
            </div>
        </div>
        <!-- Header -->
        <div class="text-center mb-unit-6 w-full">
            <h1
                class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-unit-2 tracking-tight">
                What brings you in today?</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">Please select the option that
                best describes your primary concern.</p>
        </div>
        <!-- Bento Grid for Options -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-unit-4 w-full max-w-3xl mb-unit-6">
            <!-- Option 1: Chest Pain -->
            <button
                class="group flex flex-col items-center justify-center p-unit-6 bg-surface-container-lowest rounded-xl shadow-[8px_8px_16px_#dbd9d9,-8px_-8px_16px_#ffffff] active:shadow-[inset_4px_4px_8px_#dbd9d9,inset_-4px_-4px_8px_#ffffff] transition-all duration-300 ease-in-out border-2 border-transparent focus:outline-none focus:border-primary">
                <div
                    class="bg-error-container w-24 h-24 rounded-full flex items-center justify-center mb-unit-4 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined fill text-error text-[48px]" data-icon="monitor_heart"
                        data-weight="fill">monitor_heart</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface text-center">Chest Pain &amp; Heart</h3>
            </button>
            <!-- Option 2: Cough & Respiratory -->
            <button
                class="group flex flex-col items-center justify-center p-unit-6 bg-surface-container-lowest rounded-xl shadow-[8px_8px_16px_#dbd9d9,-8px_-8px_16px_#ffffff] active:shadow-[inset_4px_4px_8px_#dbd9d9,inset_-4px_-4px_8px_#ffffff] transition-all duration-300 ease-in-out border-2 border-transparent focus:outline-none focus:border-primary">
                <div
                    class="bg-secondary-container w-24 h-24 rounded-full flex items-center justify-center mb-unit-4 group-hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined fill text-secondary text-[48px]" data-icon="stethoscope"
                        data-weight="fill">stethoscope</span>
                </div>
                <h3 class="font-headline-md text-headline-md text-on-surface text-center">Cough &amp; Respiratory</h3>
            </button>
        </div>
        <!-- Voice Input Alternate -->
        <div class="w-full flex justify-center mb-unit-6">
            <button
                class="flex items-center gap-unit-2 bg-surface-container-low px-unit-4 py-unit-2 rounded-full shadow-[4px_4px_8px_#dbd9d9,-4px_-4px_8px_#ffffff] hover:bg-surface-container transition-colors active:shadow-[inset_2px_2px_4px_#dbd9d9,inset_-2px_-2px_4px_#ffffff]">
                <span class="material-symbols-outlined text-primary" data-icon="mic">mic</span>
                <span class="font-label-sm text-label-sm text-primary">Prefer to speak? Use Voice Input</span>
            </button>
        </div>
        <!-- Navigation Actions -->
        <div class="flex w-full max-w-3xl justify-between items-center mt-auto md:mt-unit-6">
            <button
                class="flex items-center justify-center w-32 h-16 bg-surface-container-lowest rounded-full shadow-[6px_6px_12px_#dbd9d9,-6px_-6px_12px_#ffffff] text-on-surface-variant font-label-sm text-label-sm active:shadow-[inset_4px_4px_8px_#dbd9d9,inset_-4px_-4px_8px_#ffffff] transition-all">
                Back
            </button>
            <button
                class="flex items-center justify-center w-48 h-16 bg-surface-variant rounded-full text-on-surface-variant opacity-50 cursor-not-allowed font-label-sm text-label-sm transition-all"
                disabled="">
                Next Step
            </button>
        </div>
    </main>
    <!-- Footer Component from JSON -->
    <footer
        class="w-full mt-auto bg-surface-container-low dark:bg-surface-container-highest border-t border-outline-variant dark:border-outline flex flex-col md:flex-row justify-between items-center px-container-margin py-unit-4 gap-unit-2 transition-opacity duration-300">
        <div class="font-label-sm text-label-sm text-secondary">
            © 2024 MediKiosk Health. Humanist Healing Systems.
        </div>
        <div class="flex gap-unit-4 font-body-md text-body-md dark:text-on-surface-variant">
            <a class="text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                href="#">Privacy Policy</a>
            <a class="text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                href="#">Terms of Service</a>
            <a class="text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors"
                href="#">Hackathon Info</a>
        </div>
    </footer>

</html>
